<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#efede5">
  <title>页面未找到 · iiisland</title>
  <style>
    :root{--paper:#efede5;--ink:#191a19;--muted:#5c605a;--accent:#2253dc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);color-scheme:light;font-synthesis:none}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:flex;flex-direction:column;background:var(--paper);-webkit-font-smoothing:antialiased}
    .sheet{position:relative;flex:1;display:flex;flex-direction:column;width:min(100% - 2*clamp(20px,3.6vw,56px),1040px);margin:0 auto;padding:clamp(28px,5vw,64px) 0 clamp(24px,4vw,48px)}
    .top{display:flex;justify-content:space-between;gap:20px;padding-bottom:10px;border-bottom:1px solid rgba(25,26,25,.28);color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
    .stage{position:relative;flex:1;display:flex;align-items:center;padding:clamp(48px,8vw,96px) 0}
    .notch{position:absolute;top:0;left:50%;width:160px;height:26px;background:#08090a;border-radius:0 0 14px 14px;transform:translateX(-50%);box-shadow:0 10px 22px rgba(9,10,9,.22)}
    .notch::before{content:"";position:absolute;top:0;left:50%;width:5px;height:5px;border-radius:50%;background:#1b3a9e;transform:translate(-50%,8px)}
    h1{max-width:12ch;margin:22px 0 20px;font-size:clamp(46px,8vw,104px);font-weight:600;line-height:1.02;letter-spacing:-.03em;text-wrap:balance}
    p{max-width:46ch;margin:0;color:var(--muted);font-size:16px;line-height:1.75;text-wrap:pretty}
    .back{display:inline-flex;align-items:center;justify-content:space-between;gap:36px;min-height:52px;margin-top:30px;padding:0 18px;border-radius:2px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s,transform .2s}
    .back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
    .back:hover{background:var(--ink);transform:translateY(-2px)}
    .back:hover svg{transform:translate(2px,-2px)}
    .back:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .bottom{display:flex;justify-content:space-between;gap:20px;padding-top:12px;border-top:1px solid rgba(25,26,25,.16);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
    .brand{display:inline-flex;align-items:center;gap:9px;font-size:20px;font-weight:600;letter-spacing:-.035em;line-height:1;text-decoration:none;color:var(--ink);text-transform:none}
    .brand img{width:28px;height:28px;border-radius:6px;filter:grayscale(1)}
    @media(max-width:600px){.notch{width:120px;height:22px}.stage{padding:56px 0 64px}h1{font-size:clamp(42px,13vw,64px)}p{font-size:15px}.back{width:100%}.bottom{display:block;line-height:1.9}.bottom>span{display:block}.bottom>span+span{margin-top:4px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="sheet">
    <div class="top"><a class="brand" href="/" aria-label="iiisland 首页"><img src="assets/app-icon.png" width="28" height="28" alt="">iiisland</a><span>SHEET A-404</span></div>
    <div class="stage">
      <div class="notch" aria-hidden="true"></div>
      <div>
        <h1>页面<br>未找到</h1>
        <p>这个地址没有对应的页面。回到官网，继续体验音乐与歌词。</p>
        <a class="back" href="/">返回官网 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </div>
    </div>
    <div class="bottom"><span>屏幕剖面图 / THE MEASURED ELEVATION</span><span>音乐，在抬眼之间。</span></div>
  </main>
</body>
</html>
