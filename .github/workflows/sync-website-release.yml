name: Sync website release

on:
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read the latest stable release and sync the website
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" | node .github/scripts/sync-website-release.mjs
          if git diff --quiet -- website/index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- website/index.html
          git commit -m "Sync website to latest iiisland release"
          git push origin HEAD:main
